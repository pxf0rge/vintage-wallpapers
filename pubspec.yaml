name: vintage_wallpapers
description: "Vintage Wallpapers"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 2.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  coderspace: ^1.0.14
  share_plus: ^12.0.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: false
  image_path: "android/app/src/main/ic_launcher-playstore.png"

flutter:
  uses-material-design: true

  assets:
    - assets/wallpapers/
